[project]
name = "resume-pipeline"
version = "2.0.0"
description = "ResumePipeline v2 backend: one-call LLM resume generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "litellm>=1.40,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
