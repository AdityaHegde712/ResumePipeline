services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount backend source for code changes
      - ./backend:/app/backend
      # Persist application data (resume PDFs, tex files, metadata)
      - applications_data:/app/backend/data/applications
      # Mount .env file for environment variables (do NOT copy secrets into image)
      - ./backend/.env:/app/backend/.env:ro
      # Mount MiKTeX package cache for appuser
      - miktex_cache:/home/appuser/.cache/miktex
      # Sweep summaries + docs are gitignored Owner data; mount from host
      - ./docs:/app/docs:ro
    env_file:
      - ./backend/.env
    environment:
      # Override APPLICATIONS_ROOT to match mounted volume
      - APPLICATIONS_ROOT=/app/backend/data/applications
      # Mount MiKTeX package cache for appuser
      - MIKTEX_CACHE_DIR=/home/appuser/.cache/miktex
      # Optional host PANDOC_PATH passthrough
      - PANDOC_PATH=${PANDOC_PATH:-}
      # Empty override beats env_file's Windows host path; resolver falls back to PATH lookup
      - PDFLATEX_PATH=
      # First-run MiKTeX package auto-install can exceed 60s; give it headroom
      - PDF_COMPILE_TIMEOUT_SECONDS=300
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  applications_data:
    driver: local
  miktex_cache:
    driver: local
